[package]
name = "tauri-plugin-medialibrary"
version = "0.18.0"
authors = ["Dirk Lehmeier"]
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-medialibrary"
license-file = "LICENSE"
keywords = ["tauri", "media", "medialibrary", "contentprovider"]
repository = "https://github.com/universalappfactory/tauri-plugin-medialibrary"
description = "A tauri plugin to access the systems media library (e.g. the android medialibrary)"


[dependencies]
tauri = { version = "2.11.5" }
thiserror = "2"
log = "0.4.33"
serde = "1.0.229"
serde_json = "1.0.151"
base64 = "0.22.1"
fluent-uri = "0.4.1"
chrono = "0.4.45"
allmytoes = { version = "0.5.1", optional = true }
xdg-user = { version = "0.3.0", optional = true }
thumbcache = { version = "0.4.0", optional = true }
walkdir = "2.5.0"
urlencoding = "2.1.3"
regex = "1.13.1"
http = "1.4.2"
http-range = "0.1.5"
percent-encoding = "2.3.2"


[build-dependencies]
schemars = "0.8.22"
tauri-plugin = { version = "2.6.3", features = ["build"] }

[features]
default = []
xdg = ["xdg-user"]
amt = ["allmytoes"]
thumb_cache = ["thumbcache"]
